<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="HRM AI study suite mockup">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14100d"/>
      <stop offset="1" stop-color="#0b0908"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6a3a"/>
      <stop offset="1" stop-color="#e2c593"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg3)"/>
  <g opacity="0.05" stroke="#f5efe7">
    <path d="M0 70H900M0 140H900M0 210H900M0 280H900M0 350H900M0 420H900M0 490H900"/>
    <path d="M90 0V560M180 0V560M270 0V560M360 0V560M450 0V560M540 0V560M630 0V560M720 0V560M810 0V560"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="0" y="0" width="900" height="52" fill="#0d0b0a" stroke="#ffffff14"/>
    <circle cx="24" cy="26" r="9" fill="none" stroke="#c6a972" stroke-width="2"/>
    <text x="42" y="31" fill="#e2c593" font-size="15" font-weight="bold" letter-spacing="2">HRM AI STUDY SUITE</text>
    <rect x="730" y="16" width="140" height="22" rx="11" fill="#c6a972"/>
    <text x="800" y="32" fill="#1a1410" font-size="11" font-weight="bold" text-anchor="middle">SESSION: ON</text>

    <!-- progress ring + stats -->
    <circle cx="110" cy="190" r="60" fill="#ffffff06" stroke="#ffffff14" stroke-width="12"/>
    <circle cx="110" cy="190" r="60" fill="none" stroke="url(#gold3)" stroke-width="12" stroke-dasharray="283 377"/>
    <text x="110" y="186" fill="#e2c593" font-size="26" font-weight="bold" text-anchor="middle">75%</text>
    <text x="110" y="206" fill="#8f857b" font-size="10" letter-spacing="2" text-anchor="middle">MASTERY</text>

    <text x="30" y="290" fill="#8f857b" font-size="10" letter-spacing="2">QUESTIONS BANK</text>
    <g font-size="13" fill="#f5efe7">
      <text x="30" y="316">Module 1 · HR Planning   <tspan fill="#9cc79b">✓ 24/24</tspan></text>
      <text x="30" y="342">Module 2 · Recruitment   <tspan fill="#9cc79b">✓ 19/20</tspan></text>
      <text x="30" y="368">Module 3 · Training</text>
      <rect x="30" y="376" width="150" height="5" rx="3" fill="#ffffff12"/>
      <rect x="30" y="376" width="112" height="5" rx="3" fill="url(#gold3)"/>
      <text x="30" y="398">Module 4 · Compensation</text>
      <text x="30" y="424">Module 5 · Labor Law</text>
    </g>

    <!-- quiz card -->
    <rect x="230" y="84" width="420" height="250" rx="20" fill="#ffffff07" stroke="#c6a97244"/>
    <rect x="230" y="84" width="420" height="58" rx="20" fill="#ffffff05" stroke="#ffffff0d"/>
    <text x="256" y="110" fill="#8f857b" font-size="10" letter-spacing="2">QUESTION 12 / 20 · RECRUITMENT</text>
    <text x="256" y="132" fill="#e2c593" font-size="12">Mode: AI Practice</text>

    <text x="256" y="176" fill="#f5efe7" font-size="17" font-weight="bold">Which selection tool best predicts long-</text>
    <text x="256" y="200" fill="#f5efe7" font-size="17" font-weight="bold">term job performance?</text>

    <g font-size="13.5">
      <rect x="256" y="222" width="366" height="34" rx="9" fill="#ffffff06" stroke="#ffffff14"/>
      <text x="274" y="245" fill="#b7ada1">A. Aptitude tests</text>
      <rect x="256" y="264" width="366" height="34" rx="9" fill="#ffffff06" stroke="#ffffff14"/>
      <text x="274" y="287" fill="#b7ada1">B. Structured interviews</text>
      <rect x="256" y="306" width="366" height="34" rx="9" fill="#ffffff06" stroke="#c6a97255"/>
      <text x="274" y="329" fill="#c6a972">C. Work-sample tests</text>
    </g>
    <circle cx="604" cy="323" r="8" fill="none" stroke="#c6a972" stroke-width="2"/>
    <path d="M601 323l3 3 6-6" stroke="#c6a972" stroke-width="2" fill="none"/>

    <!-- AI explainer -->
    <rect x="230" y="350" width="420" height="100" rx="16" fill="#c6a97214" stroke="#c6a97233"/>
    <text x="256" y="376" fill="#e2c593" font-size="11" font-weight="bold" letter-spacing="2">AI EXPLAINER</text>
    <text x="256" y="400" fill="#b7ada1" font-size="12.5">Work-sample tests simulate actual job tasks, giving</text>
    <text x="256" y="420" fill="#b7ada1" font-size="12.5">the strongest validity coefficient (r ≈ .54).</text>
    <rect x="256" y="436" width="70" height="26" rx="13" fill="url(#gold3)"/>
    <text x="291" y="454" fill="#1a1410" font-size="11" font-weight="bold" text-anchor="middle">NEXT →</text>

    <!-- right rail -->
    <rect x="676" y="84" width="194" height="250" rx="20" fill="#ffffff07" stroke="#ffffff14"/>
    <text x="696" y="110" fill="#8f857b" font-size="10" letter-spacing="2">STREAK</text>
    <g font-size="22" font-weight="bold" fill="#e2c593">
      <text x="696" y="142">28</text><text x="726" y="142" fill="#8f857b" font-size="14">days</text>
    </g>
    <text x="696" y="172" fill="#8f857b" font-size="10" letter-spacing="2">WEAK AREAS</text>
    <g font-size="12" fill="#f5efe7">
      <text x="696" y="196">· Compensation & Benefits</text>
      <text x="696" y="218">· Collective Bargaining</text>
      <text x="696" y="240">· Performance Appraisal</text>
    </g>
    <rect x="696" y="258" width="154" height="34" rx="11" fill="#ffffff08" stroke="#c6a97244"/>
    <text x="773" y="281" fill="#c6a972" font-size="11" font-weight="bold" text-anchor="middle">TRAIN MODULES ↺</text>

    <!-- bottom stats -->
    <rect x="230" y="470" width="200" height="60" rx="16" fill="#ffffff05" stroke="#ffffff10"/>
    <text x="250" y="496" fill="#8f857b" font-size="10" letter-spacing="2">TOTAL QUESTIONS</text>
    <text x="250" y="518" fill="#e2c593" font-size="20" font-weight="bold">940</text>
    <rect x="450" y="470" width="200" height="60" rx="16" fill="#ffffff05" stroke="#ffffff10"/>
    <text x="470" y="496" fill="#8f857b" font-size="10" letter-spacing="2">ACCURACY</text>
    <text x="470" y="518" fill="#e2c593" font-size="20" font-weight="bold">86.4%</text>
    <rect x="670" y="470" width="200" height="60" rx="16" fill="#ffffff05" stroke="#ffffff10"/>
    <text x="690" y="496" fill="#8f857b" font-size="10" letter-spacing="2">OFFLINE READY</text>
    <text x="690" y="518" fill="#9cc79b" font-size="20" font-weight="bold">✓ PWA</text>
  </g>
