    <text x="16" y="122" fill="#e2c593" font-size="13" font-weight="bold">Clusters (K)</text>
    <rect x="16" y="132" width="132" height="5" rx="3" fill="#ffffff12"/>
    <rect x="16" y="132" width="66" height="5" rx="3" fill="url(#gold2)"/>
