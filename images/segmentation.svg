    <text x="16" y="172" fill="#e2c593" font-size="13" font-weight="bold">Algorithm</text>
    <rect x="16" y="182" width="166" height="34" rx="9" fill="#ffffff08" stroke="#ffffff14"/>
    <text x="30" y="204" fill="#f5efe7" font-size="12">K-Means</text>
    <text x="170" y="204" fill="#c6a972" font-size="10">▾</text>
    <text x="16" y="242" fill="#8f857b" font-size="10" letter-spacing="2">FEATURES</text>
    <rect x="16" y="252" width="166" height="30" rx="9" fill="#c6a97222" stroke="#c6a97244"/>
    <text x="30" y="272" fill="#e2c593" font-size="12">✓ Recency</text>
    <rect x="16" y="288" width="166" height="30" rx="9" fill="#c6a97222" stroke="#c6a97244"/>
