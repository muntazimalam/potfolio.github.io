        <circle cx="352" cy="243" r="5"/><circle cx="312" cy="258" r="5"/><circle cx="338" cy="280" r="5"/>
      </g>
      <g fill="#c6a972" opacity="0.85">
        <circle cx="440" cy="180" r="5"/><circle cx="465" cy="165" r="5"/><circle cx="452" cy="196" r="5"/>
        <circle cx="480" cy="172" r="5"/><circle cx="432" cy="170" r="5"/>
      </g>
      <g fill="#9cc79b" opacity="0.85">
        <circle cx="520" cy="110" r="5"/><circle cx="545" cy="96" r="5"/><circle cx="532" cy="128" r="5"/>
        <circle cx="508" cy="100" r="5"/><circle cx="558" cy="118" r="5"/>
      </g>
      <g fill="#b7ada1" opacity="0.85">
        <circle cx="380" cy="220" r="5"/><circle cx="400" cy="236" r="5"/><circle cx="416" cy="214" r="5"/>
        <circle cx="394" cy="202" r="5"/>
      </g>
      <g stroke="#e2c593" fill="none" stroke-width="2">
        <circle cx="346" cy="258" r="42" stroke-dasharray="4 3" opacity="0.55"/>
        <circle cx="458" cy="180" r="38" stroke-dasharray="4 3" opacity="0.55"/>
        <circle cx="530" cy="112" r="36" stroke-dasharray="4 3" opacity="0.55"/>
        <circle cx="398" cy="222" r="32" stroke-dasharray="4 3" opacity="0.55"/>
      </g>
    </g>

    <!-- segment legend -->
    <rect x="228" y="366" width="400" height="164" rx="16" fill="#ffffff07" stroke="#ffffff14"/>
    <text x="248" y="394" fill="#8f857b" font-size="11" letter-spacing="2">SEGMENT PROFILES</text>
    <g font-size="12">
      <rect x="248" y="408" width="168" height="30" rx="9" fill="#ffffff08"/>
      <circle cx="264" cy="423" r="6" fill="#e2c593"/>
      <text x="280" y="428" fill="#f5efe7">At-risk · low spend</text>
      <rect x="428" y="408" width="168" height="30" rx="9" fill="#ffffff08"/>
      <circle cx="444" cy="423" r="6" fill="#c6a972"/>
