<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="AI customer segmentation dashboard mockup">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14100d"/>
      <stop offset="1" stop-color="#0b0908"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6a3a"/>
      <stop offset="1" stop-color="#e2c593"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg2)"/>
  <g opacity="0.05" stroke="#f5efe7">
    <path d="M0 70H900M0 140H900M0 210H900M0 280H900M0 350H900M0 420H900M0 490H900"/>
    <path d="M90 0V560M180 0V560M270 0V560M360 0V560M450 0V560M540 0V560M630 0V560M720 0V560M810 0V560"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="0" y="0" width="900" height="52" fill="#0d0b0a" stroke="#ffffff14"/>
    <circle cx="24" cy="26" r="9" fill="none" stroke="#c6a972" stroke-width="2"/>
    <text x="42" y="31" fill="#e2c593" font-size="15" font-weight="bold" letter-spacing="2">CUSTOMER SEGMENTATION</text>
    <rect x="730" y="16" width="140" height="22" rx="11" fill="#c6a972"/>
    <text x="800" y="32" fill="#1a1410" font-size="11" font-weight="bold" text-anchor="middle">K = 4 · SIL 0.42</text>

