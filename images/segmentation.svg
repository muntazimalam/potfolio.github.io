    </g>

    <!-- right: RFM stats -->
    <rect x="656" y="82" width="214" height="270" rx="16" fill="#ffffff07" stroke="#ffffff14"/>
    <text x="676" y="108" fill="#8f857b" font-size="11" letter-spacing="2">RFM SUMMARY</text>
    <g font-size="12">
      <text x="676" y="144" fill="#8f857b">Recency</text>
      <text x="848" y="144" fill="#f5efe7" text-anchor="end" font-weight="bold">38 days</text>
      <text x="676" y="182" fill="#8f857b">Frequency</text>
      <text x="848" y="182" fill="#f5efe7" text-anchor="end" font-weight="bold">11.2</text>
      <text x="676" y="220" fill="#8f857b">Monetary</text>
      <text x="848" y="220" fill="#f5efe7" text-anchor="end" font-weight="bold">₹ 24,580</text>
    </g>
    <rect x="676" y="240" width="174" height="8" rx="4" fill="#ffffff0f"/>
    <rect x="676" y="240" width="142" height="8" rx="4" fill="url(#gold2)"/>
    <rect x="676" y="266" width="174" height="8" rx="4" fill="#ffffff0f"/>
    <rect x="676" y="266" width="118" height="8" rx="4" fill="url(#gold2)"/>
    <rect x="676" y="292" width="174" height="8" rx="4" fill="#ffffff0f"/>
    <rect x="676" y="292" width="160" height="8" rx="4" fill="url(#gold2)"/>

    <!-- silhouette + bar chart -->
    <rect x="656" y="366" width="214" height="164" rx="16" fill="#ffffff07" stroke="#ffffff14"/>
    <text x="676" y="394" fill="#8f857b" font-size="11" letter-spacing="2">SIZE PER CLUSTER</text>
    <g>
      <rect x="676" y="410" width="34" height="46" rx="5" fill="#e2c593"/>
      <rect x="722" y="410" width="34" height="76" rx="5" fill="#c6a972"/>
      <rect x="768" y="410" width="34" height="30" rx="5" fill="#9cc79b"/>
      <rect x="814" y="410" width="34" height="58" rx="5" fill="#b7ada1"/>
      <text x="693" y="498" fill="#8f857b" font-size="10" text-anchor="middle">C0</text>
      <text x="739" y="498" fill="#8f857b" font-size="10" text-anchor="middle">C1</text>
      <text x="785" y="498" fill="#8f857b" font-size="10" text-anchor="middle">C2</text>
      <text x="831" y="498" fill="#8f857b" font-size="10" text-anchor="middle">C3</text>
      <text x="676" y="518" fill="#e2c593" font-size="11" font-weight="bold">Silhouette: 0.42</text>
    </g>
