<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Media processing pipeline dashboard mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14100d"/>
      <stop offset="1" stop-color="#0b0908"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6a3a"/>
      <stop offset="1" stop-color="#e2c593"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6a972" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c6a972" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#f5efe7">
    <path d="M0 70H900M0 140H900M0 210H900M0 280H900M0 350H900M0 420H900M0 490H900"/>
    <path d="M90 0V560M180 0V560M270 0V560M360 0V560M450 0V560M540 0V560M630 0V560M720 0V560M810 0V560"/>
  </g>
  <g font-family="Arial, sans-serif">
    <!-- top bar -->
    <rect x="0" y="0" width="900" height="52" fill="#0d0b0a" stroke="#ffffff14"/>
    <circle cx="24" cy="26" r="9" fill="none" stroke="#c6a972" stroke-width="2"/>
    <text x="42" y="31" fill="#e2c593" font-size="15" font-weight="bold" letter-spacing="2">MEDIA PIPELINE</text>
    <rect x="740" y="16" width="130" height="22" rx="11" fill="#c6a972"/>
    <text x="805" y="32" fill="#1a1410" font-size="11" font-weight="bold" text-anchor="middle">● PROCESSING</text>

    <!-- sidebar -->
    <rect x="0" y="52" width="150" height="508" fill="#0f0d0b" stroke="#ffffff0d"/>
    <g fill="#8f857b" font-size="13">
      <text x="16" y="100">Dashboard</text><rect x="10" y="84" width="130" height="30" rx="8" fill="#c6a97222"/>
      <text x="16" y="146" fill="#e2c593">Upload</text>
      <text x="16" y="184">Gallery</text>
      <text x="16" y="222">Reports</text>
      <text x="16" y="260">Settings</text>
    </g>

    <!-- main upload card -->
    <rect x="180" y="82" width="330" height="170" rx="16" fill="#ffffff08" stroke="#c6a97255" stroke-dasharray="7 6"/>
    <rect x="180" y="82" width="330" height="170" rx="16" fill="url(#scan)" opacity="0.08"/>
    <circle cx="345" cy="140" r="26" fill="none" stroke="#c6a972" stroke-width="2"/>
    <path d="M336 140h18M345 131v18" stroke="#c6a972" stroke-width="2" stroke-linecap="round"/>
    <text x="345" y="198" fill="#c6a972" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">DROP IMAGE</text>
    <text x="345" y="220" fill="#8f857b" font-size="11" text-anchor="middle">or drag vehicle photos here</text>
    <rect x="180" y="266" width="330" height="34" rx="12" fill="#ffffff08"/>
    <text x="200" y="288" fill="#8f857b" font-size="12">batch_queue.fastq · 1.8 MB waiting…</text>

    <!-- result panel -->
    <rect x="540" y="82" width="330" height="218" rx="16" fill="#ffffff08" stroke="#ffffff14"/>
    <text x="562" y="112" fill="#e2c593" font-size="13" font-weight="bold" letter-spacing="1">ANALYSIS RESULT</text>
    <rect x="562" y="128" width="286" height="52" rx="10" fill="#0d0b0a"/>
    <text x="580" y="152" fill="#8f857b" font-size="10" letter-spacing="2">PLATE</text>
    <text x="580" y="170" fill="#f5efe7" font-size="19" font-weight="bold" font-family="Consolas, monospace">KA05 EX 5678</text>
    <rect x="562" y="192" width="286" height="40" rx="10" fill="#0d0b0a"/>
    <text x="580" y="208" fill="#8f857b" font-size="10" letter-spacing="2">VEHICLE</text>
    <text x="580" y="224" fill="#f5efe7" font-size="14">Motorcycle · 2-line plate merged ✓</text>
    <rect x="562" y="244" width="286" height="40" rx="10" fill="#0d0b0a"/>
    <text x="580" y="260" fill="#8f857b" font-size="10" letter-spacing="2">STATUS</text>
    <text x="580" y="276" fill="#9cc79b" font-size="13" font-weight="bold">✓ Authentic · No tampering detected</text>

    <!-- confidence bar -->
    <rect x="180" y="330" width="690" height="110" rx="16" fill="#ffffff08" stroke="#ffffff14"/>
    <text x="200" y="358" fill="#8f857b" font-size="11" letter-spacing="2">CONFIDENCE</text>
    <rect x="200" y="370" width="650" height="8" rx="4" fill="#ffffff0f"/>
    <rect x="200" y="370" width="598" height="8" rx="4" fill="url(#gold)"/>
    <text x="828" y="372" fill="#e2c593" font-size="13" font-weight="bold">92%</text>
    <circle cx="640" cy="410" r="16" fill="none" stroke="#c6a972" stroke-width="3" stroke-dasharray="90 18"/>
    <text x="640" y="415" fill="#e2c593" font-size="11" font-weight="bold" text-anchor="middle">L 4</text>
    <text x="676" y="414" fill="#8f857b" font-size="11">lighting-adjusted scoring — blur metric skipped</text>

    <!-- stream row -->
    <rect x="180" y="460" width="220" height="70" rx="16" fill="#ffffff06" stroke="#ffffff10"/>
    <text x="200" y="490" fill="#8f857b" font-size="10" letter-spacing="2">POSTGRES</text>
    <text x="200" y="512" fill="#e2c593" font-size="13" font-weight="bold">connected</text>
    <rect x="420" y="460" width="220" height="70" rx="16" fill="#ffffff06" stroke="#ffffff10"/>
    <text x="440" y="490" fill="#8f857b" font-size="10" letter-spacing="2">CELERY / REDIS</text>
    <text x="440" y="512" fill="#e2c593" font-size="13" font-weight="bold">queue active</text>
    <rect x="660" y="460" width="210" height="70" rx="16" fill="#ffffff06" stroke="#ffffff10"/>
    <text x="680" y="490" fill="#8f857b" font-size="10" letter-spacing="2">MEMORY PEAK</text>
    <text x="680" y="512" fill="#e2c593" font-size="13" font-weight="bold">280 MB ✓ free tier safe</text>
  </g>
</svg>