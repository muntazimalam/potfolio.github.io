services:
  - type: web
    name: muntazim-portfolio-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: NOTIFY_TO
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://muntazimalam.github.io"